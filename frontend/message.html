<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Message</title>
</head>
<style>
    body {
        background-color: #ece5dd;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }

    #chat-app {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .chatroom {
        background-color: #fff;
        width: 450px;
        height: 90vh;
        display: flex;
        flex-direction: column;
        border-radius: 10px;
        box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
        overflow: hidden;
    }

    .message-container {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background-color: #14898d73; /* Optional WhatsApp-style background */
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
    }

    .receive, .send {
        max-width: 70%;
        padding: 5px 5px;
        border-radius: 10px;
        margin-bottom: 8px;
        position: relative;
        font-size: 14px;
        line-height: 0.5;
        word-wrap: break-word;
    }

    .receive {
        background-color: #ffffff;
        align-self: flex-start;
        border-radius: 10px 10px 10px 0;
        box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    .send {
        background-color: #dcf8c6;
        align-self: flex-end;
        border-radius: 10px 10px 0 10px;
        box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    .receive small, .send small {
        display: block;
        font-size: 11px;
        color: gray;
        text-align: right;
        margin-top: 5px;
    }

    .chat-form {
        display: flex;
        padding: 10px;
        background-color: #f0f0f0;
        border-top: 1px solid #ddd;
    }

    .chat-form textarea {
        flex: 1;
        resize: none;
        border: none;
        border-radius: 20px;
        padding: 10px 15px;
        font-size: 14px;
        outline: none;
        background-color: #fff;
        max-height: 80px;
    }

    .chat-form button {
        margin-left: 10px;
        padding: 10px 18px;
        background-color: #25d366;
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }

    .chat-form button:hover {
        background-color: #20ba57;
    }
</style>

<body>
    <section id="chat-app">
        <section class="chatroom">
            <div class="message-container" id="chatContainer">
                {% for index in messages %}
                    {% if index.sender != username %}
                        <div class="receive">
                            <p>{{ index.message }}</p>
                            <small>{{ index.sender }} • {{ index.created_at|timesince }}</small>
                        </div>
                    {% else %}
                        <div class="send">
                            <p>{{ index.message }}</p>
                            <small>{{ index.created_at|timesince }}</small>
                        </div>
                    {% endif %}
                {% endfor %}
            </div>
            <div class="chat-form">
                <form id="message-form" action="" method="post" style="display:flex;width:100%;align-items:center;">
                    {% csrf_token %}
                    <textarea id="msg" name="message" rows="1" placeholder="Type a message"></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>
        </section>
    </section>
</body>


<script>
function scrollToBottom() {
    const chatContainer = document.getElementById("chatContainer");
    if (chatContainer) {
        chatContainer.scrollTo({
            top: chatContainer.scrollHeight,
            behavior: 'smooth'
        });
    }
}

document.addEventListener("DOMContentLoaded", function () {
    const websocketProtocol = window.location.protocol === "https:" ? "wss" : "ws";
    const wsEndpoint = `${websocketProtocol}://${window.location.host}/ws/notification/{{room}}/`;
    const socket = new WebSocket(wsEndpoint);
    const currentUser = '{{username}}';

    socket.onopen = () => console.log("WebSocket connection opened");
    socket.onclose = () => console.log("WebSocket connection closed");

    document.getElementById("message-form").addEventListener("submit", function (event) {
        event.preventDefault();
        const messageInput = document.getElementById("msg");
        const message = messageInput.value.trim();
        if (!message) return;

        // Optimistic render
        const messageDiv = document.querySelector('.message-container');
        const tempMsg = document.createElement("div");
        tempMsg.className = "send";
        tempMsg.innerHTML = `<p>${message}</p>`;
        messageDiv.appendChild(tempMsg);
        scrollToBottom();

        // Send to server (so it gets broadcast to all)
        socket.send(JSON.stringify({
            message: message,
            room_name: '{{room}}',
            sender: currentUser
        }));

        messageInput.value = "";
    });

    socket.addEventListener("message", (event) => {
        const messageData = JSON.parse(event.data)["message"];
        const sender = messageData["sender"];
        const message = messageData["message"];

        const messageDiv = document.querySelector('.message-container');
        if (!messageDiv) return;

        // If sender is not the current user, show as received
        if (sender !== currentUser) {
            const newMessage = document.createElement("div");
            newMessage.className = "receive";
            newMessage.innerHTML = `<p>${message}</p><small>${sender}</small>`;
            messageDiv.appendChild(newMessage);
            scrollToBottom();
        }
    });
});
</script>



</html>
